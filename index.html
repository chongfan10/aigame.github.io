<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 网站图标 -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>">
    <title>AI制作游戏平台 - 档案库</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 顶部导航 -->
    <div class="breadcrumbs">
        <a onclick="switchView('category-view', this)" class="active">首页</a> 
        <span>/</span> 
        <a onclick="switchView('ranking-view', this)">热梗游戏</a> 
        <span>/</span> 
        <a onclick="switchView('collection-view', this)">往期编年</a>
    </div>

    <main id="app">
        
        <!-- 视图1：首页 -->
        <section id="category-view" class="view-section active">
            <div class="page-title-wrapper">
                <div class="page-title">热梗AI游戏库</div>
                <div class="page-subtitle">探索AI参与创作的小游戏</div>
            </div>
            <div class="game-grid" id="category-game-grid"></div>
        </section>

        <!-- 视图2：热梗游戏页 -->
        <section id="ranking-view" class="view-section">
            <div class="page-title-wrapper">
                <div class="page-title">热梗游戏分场</div>
                <div class="page-subtitle">今日热搜，明日史书</div>
            </div>
            
            <div class="category-layout">
                <aside class="sidebar">
                    <div class="sidebar-title">分类系列</div>
                    <ul id="ranking-category-list"></ul>
                </aside>
                
                <div style="flex-grow: 1; min-width: 0;">
                    <div class="ranking-container" id="ranking-game-grid"></div>
                </div>
            </div>
        </section>

        <!-- 视图3：执笔人档案馆 -->
        <section id="collection-view" class="view-section">
            <div class="page-title-wrapper">
                <div class="page-title">执笔人档案馆</div>
                <div class="page-subtitle">那些创造热梗历史的UP主们</div>
            </div>
            
            <div class="category-layout">
                <aside class="sidebar">
                    <div class="sidebar-title">UP主系列</div>
                    <ul id="up-category-list"></ul>
                </aside>
                
                <div style="flex-grow: 1; min-width: 0;">
                    <div class="up-grid" id="collection-up-grid"></div>
                </div>
            </div>
        </section>

    </main>

    <!-- 底部免责声明 -->
    <footer>
        <p>本站为个人非盈利兴趣导航站，仅供学习交流。所有游戏、图片及作者信息版权均归原作者所有。</p>
        <p>如您（原作者）不希望您的作品出现在本站，请联系 <strong>your-email@example.com</strong>，我将第一时间下架处理。</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
